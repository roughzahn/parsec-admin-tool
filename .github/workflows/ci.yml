name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check backend syntax
        run: node --check server.mjs
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Build Docker image
        run: docker build -t parsec-admin-tool:ci .
